        },
        {
          "uses": "Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6"
        },
        {
          "name": "Install cargo-semver-checks",
          "uses": "taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29",
          "with": {
            "tool": "cargo-semver-checks"
          }
        },
        {
          "name": "Determine semver release type",
          "run": "if git log --format=%B \\\n  cd88056ffdc97756fbd98e5a12bbeb41758f0ce8..e41a21bf6f0dc0c9431daaca765f1bf2a9c14e09 \\\n  | grep -Eq '(^[A-Za-z0-9_-]+(\\([^)]*\\))?!:|^BREAKING[ -]CHANGE:)'; then\n  echo \"SEMVER_RELEASE_TYPE=major\" >> \"$GITHUB_ENV\"\nelse\n  echo \"SEMVER_RELEASE_TYPE=minor\" >> \"$GITHUB_ENV\"\nfi\n"
        },
        {
          "name": "Check rmcp (default features)",
          "run": "cargo semver-checks \\\n  --package rmcp \\\n  --baseline-rev cd88056ffdc97756fbd98e5a12bbeb41758f0ce8 \\\n  --release-type \"$SEMVER_RELEASE_TYPE\" \\\n  --only-explicit-features \\\n  --features default\n"
        },
