          "name": "Install cargo-hack",
          "uses": "taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29",
          "with": {
            "tool": "cargo-hack"
          }
        },
        {
          "name": "Run clippy (reduced feature sets)",
          "run": "cargo hack clippy --package rmcp --lib --each-feature --exclude-features local -- -D warnings\n"
        }
      ]
    },
    "semver": {
      "name": "SemVer Check",
      "runs-on": "ubuntu-latest",
      "steps": [
