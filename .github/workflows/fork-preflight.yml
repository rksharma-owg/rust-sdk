    "public-api": {
      "name": "Public API Check",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "fetch-depth": 0,
            "ref": "e41a21bf6f0dc0c9431daaca765f1bf2a9c14e09"
          }
        },
        {
          "name": "Verify exact source and baseline",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"e41a21bf6f0dc0c9431daaca765f1bf2a9c14e09\"\ngit merge-base --is-ancestor cd88056ffdc97756fbd98e5a12bbeb41758f0ce8 HEAD\nprintf 'Source: %s\\nBaseline: %s\\nWorkflow: %s\\n' \"$(git rev-parse HEAD)\" 'cd88056ffdc97756fbd98e5a12bbeb41758f0ce8' '${{ github.workflow_sha }}'\nrustc --version\ncargo --version\n"
        },
        {
          "name": "Install Rust",
          "uses": "dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb"
        },
        {
          "uses": "Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6"
        },
        {
          "name": "Install cargo-public-api",
          "uses": "taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29",
          "with": {
            "tool": "cargo-public-api"
          }
        },
        {
          "name": "Determine release type and deny flags",
          "run": "if git log --format=%B \\\n  cd88056ffdc97756fbd98e5a12bbeb41758f0ce8..e41a21bf6f0dc0c9431daaca765f1bf2a9c14e09 \\\n  | grep -Eq '(^[A-Za-z0-9_-]+(\\([^)]*\\))?!:|^BREAKING[ -]CHANGE:)'; then\n  SEMVER_RELEASE_TYPE=major\nelse\n  SEMVER_RELEASE_TYPE=minor\nfi\ncase \"$SEMVER_RELEASE_TYPE\" in\n  major) DENY=\"\" ;;\n  patch) DENY=\"--deny added --deny changed --deny removed\" ;;\n  *)     DENY=\"--deny changed --deny removed\" ;;\nesac\necho \"SEMVER_RELEASE_TYPE=$SEMVER_RELEASE_TYPE\" >> \"$GITHUB_ENV\"\necho \"DENY=$DENY\" >> \"$GITHUB_ENV\"\n"
        },
        {
          "name": "Check rmcp (default features)",
          "run": "cargo public-api \\\n  --package rmcp \\\n  -ss \\\n  diff \\\n  $DENY \\\n  --force \\\n  cd88056ffdc97756fbd98e5a12bbeb41758f0ce8..e41a21bf6f0dc0c9431daaca765f1bf2a9c14e09\n"
        },
        {
          "name": "Check rmcp (all features except local)",
          "run": "BASE_SHA=cd88056ffdc97756fbd98e5a12bbeb41758f0ce8\n# `cargo public-api diff` builds both revisions with the same feature\n# set, so a feature that exists on only one side (e.g. a feature added\n# or removed by this PR) would fail to build the other revision. Diff\n# only the features present in BOTH the base and the head; features\n# unique to one side are necessarily pure additions/removals, which the\n# release-type deny flags already govern.\nlist_features() {\n  cargo metadata --no-deps --format-version 1 --manifest-path \"$1/Cargo.toml\" \\\n    | jq -r '.packages[] | select(.name == \"rmcp\") | .features | keys[]\n             | select(startswith(\"__\") | not)\n             | select(. != \"local\")'\n}\nlist_features \".\" | sort -u > \"$RUNNER_TEMP/head_features\"\ngit worktree add --detach \"$RUNNER_TEMP/rmcp-base\" \"$BASE_SHA\"\nlist_features \"$RUNNER_TEMP/rmcp-base\" | sort -u > \"$RUNNER_TEMP/base_features\"\ngit worktree remove --force \"$RUNNER_TEMP/rmcp-base\"\nFEATURES=$(comm -12 \"$RUNNER_TEMP/head_features\" \"$RUNNER_TEMP/base_features\" | paste -sd, -)\ncargo public-api \\\n  --package rmcp \\\n  --features \"$FEATURES\" \\\n  -ss \\\n  diff \\\n  $DENY \\\n  --force \\\n  \"$BASE_SHA\"..e41a21bf6f0dc0c9431daaca765f1bf2a9c14e09\n"
        }
      ]
    },
