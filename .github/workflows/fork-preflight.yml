    "conformance-server": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "e41a21bf6f0dc0c9431daaca765f1bf2a9c14e09",
            "fetch-depth": 0
          }
        },
        {
          "name": "Verify exact source and baseline",
          "shell": "bash",
          "run": "set -euo pipefail\ntest \"$(git rev-parse HEAD)\" = \"e41a21bf6f0dc0c9431daaca765f1bf2a9c14e09\"\ngit merge-base --is-ancestor cd88056ffdc97756fbd98e5a12bbeb41758f0ce8 HEAD\nprintf 'Source: %s\\nBaseline: %s\\nWorkflow: %s\\n' \"$(git rev-parse HEAD)\" 'cd88056ffdc97756fbd98e5a12bbeb41758f0ce8' '${{ github.workflow_sha }}'\nrustc --version\ncargo --version\n"
        },
        {
          "name": "Install Rust toolchain",
          "uses": "dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c"
        },
        {
          "uses": "Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6"
        },
        {
          "name": "Build conformance binaries",
          "run": "cargo build -p mcp-conformance"
        },
        {
          "name": "Test conformance server",
          "run": "cargo test -p mcp-conformance --bin conformance-server"
        },
        {
          "name": "Start conformance server",
          "run": "PORT=8001 ./target/debug/conformance-server &\necho $! > server.pid\nfor _ in $(seq 1 30); do\n  if curl -s -o /dev/null http://127.0.0.1:8001/mcp; then\n    exit 0\n  fi\n  sleep 1\ndone\necho \"conformance server did not become ready\" >&2\nexit 1\n"
        },
        {
          "name": "Run 2025-11-25 server suite",
          "run": "npx -y \"@modelcontextprotocol/conformance@${CONFORMANCE_VERSION}\" server \\\n  --url http://127.0.0.1:8001/mcp \\\n  --suite all \\\n  --spec-version 2025-11-25 \\\n  -o conformance-results/2025-11-25\n"
        },
        {
          "name": "Run 2026-07-28 server suite",
          "run": "npx -y \"@modelcontextprotocol/conformance@${CONFORMANCE_VERSION}\" server \\\n  --url http://127.0.0.1:8001/mcp \\\n  --suite all \\\n  --spec-version 2026-07-28 \\\n  -o conformance-results/2026-07-28\n"
        },
        {
          "name": "Run extension server scenarios (informational)",
          "run": "scenarios=(\n  tasks-lifecycle\n  tasks-capability-negotiation\n  tasks-wire-fields\n  tasks-request-state-removal\n  tasks-mrtr-input\n  tasks-request-headers\n  tasks-dispatch-and-envelope\n  tasks-status-notifications\n  tasks-required-task-error\n  tasks-mrtr-composition\n)\nfor scenario in \"${scenarios[@]}\"; do\n  npx -y \"@modelcontextprotocol/conformance@${CONFORMANCE_VERSION}\" server \\\n    --url http://127.0.0.1:8001/mcp \\\n    --scenario \"$scenario\" \\\n    --expected-failures conformance/expected-failures-extensions.yaml \\\n    -o conformance-extension-results\ndone\n"
        },
        {
          "name": "Stop conformance server",
          "if": "always()",
          "run": "kill \"$(cat server.pid)\" 2>/dev/null || true"
        },
        {
          "name": "Upload results",
          "if": "always()",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "conformance-server-results",
            "path": "conformance-results\nconformance-extension-results\n"
          }
        }
      ]
    },
