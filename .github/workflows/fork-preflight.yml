          "name": "Check rmcp (all features except local)",
          "run": "FEATURES=$(cargo metadata --no-deps --format-version 1 \\\n  | jq -r '[.packages[] | select(.name == \"rmcp\") | .features | keys[]\n            | select(startswith(\"__\") | not)\n            | select(. != \"local\")] | join(\",\")')\ncargo semver-checks \\\n  --package rmcp \\\n  --baseline-rev cd88056ffdc97756fbd98e5a12bbeb41758f0ce8 \\\n  --release-type \"$SEMVER_RELEASE_TYPE\" \\\n  --only-explicit-features \\\n  --features \"$FEATURES\"\n"
