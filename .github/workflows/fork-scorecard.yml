{
  "name": "Fork Scorecard rmcp 1353",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "tested_sha": {
          "description": "Full contribution commit SHA",
          "required": true,
          "type": "string"
        },
        "base_sha": {
          "description": "Full current upstream target SHA",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": "read-all",
  "jobs": {
    "analysis": {
      "name": "Scorecard analysis",
      "runs-on": "ubuntu-latest",
      "permissions": {
        "security-events": "write",
        "id-token": "write"
      },
      "steps": [
        {
          "name": "Checkout code",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "ref": "${{ inputs.tested_sha }}",
            "fetch-depth": 0
          }
        },
        {
          "name": "Verify exact source and baseline",
          "shell": "bash",
          "env": {
            "EXPECTED_SHA": "${{ inputs.tested_sha }}",
            "BASE_SHA": "${{ inputs.base_sha }}"
          },
          "run": "set -euo pipefail\n[[ \"$EXPECTED_SHA\" =~ ^[0-9a-f]{40}$ ]]\n[[ \"$BASE_SHA\" =~ ^[0-9a-f]{40}$ ]]\ntest \"$(git rev-parse HEAD)\" = \"$EXPECTED_SHA\"\ngit merge-base --is-ancestor \"$BASE_SHA\" HEAD\nprintf \"Source: %s\\nBaseline: %s\\n\" \"$EXPECTED_SHA\" \"$BASE_SHA\""
        },
        {
          "name": "Run analysis",
          "uses": "ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc",
          "with": {
            "results_file": "results.sarif",
            "results_format": "sarif",
            "publish_results": false
          }
        },
        {
          "name": "Upload SARIF artifact",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "scorecard-results",
            "path": "results.sarif",
            "retention-days": "5"
          }
        },
        {
          "name": "Upload to code scanning",
          "uses": "github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2",
          "with": {
            "sarif_file": "results.sarif"
          }
        }
      ]
    }
  }
}
